<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clasament - Geo Quiz</title>
  <link rel="stylesheet" href="../styles/clasament.css">
</head>
<body>

  <header class="topbar">
    <div class="container topbar-content">
      <a href="Index.html" class="logo">Geo Quiz</a>

      <nav class="nav">
        <ul>
          <li><a href="Index.html">Acasă</a></li>
          <li><a href="teste.html">Teste</a></li>
          <li><a href="clasament.html" class="active">Clasament</a></li>
          <li><a href="despre.html">Despre</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero-page">
      <div class="container">
        <span class="page-badge">Rezultatele jucătorilor</span>
        <h1>Clasament</h1>
        <p class="page-text">
          Aici poți vedea rezultatele salvate după terminarea testelor.
        </p>
      </div>
    </section>

    <section class="ranking-section">
      <div class="container">
        <div class="ranking-info">
          <div class="info-card">
            <h2>Total rezultate</h2>
            <p id="numarJucatori">0</p>
          </div>

          <div class="info-card">
            <h2>Cel mai mare scor</h2>
            <p id="scorMaxim">0</p>
          </div>
        </div>

        <div class="table-box">
          <table>
  <thead>
    <tr>
      <th>Loc</th>
      <th>Jucător</th>
      <th>Joc</th>
      <th>Scor</th>
    </tr>
  </thead>
  <tbody id="clasamentBody"></tbody>
</table>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <p>© <span id="anCurent"></span> Geo Quiz</p>
      <p>Pagina clasament</p>
    </div>
  </footer>

  <script src="../Js/clasament.js"></script>
</body>
</html>
