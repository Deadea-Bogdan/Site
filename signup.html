<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/styles/signup.css">
  <title>Înregistrare - Geo Quiz</title>
</head>
<body>

  <header>
    <a href="Main.html">Geo Quiz</a>
    <nav>
      <ul>
        <li><a href="Main.html">Acasă</a></li>
        <li><a href="teste.html">Teste</a></li>
        <li><a href="clasament.html">Clasament</a></li>
        <li><a href="despre.html">Despre</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h1>Înregistrare</h1>
      <p>Creează-ți un cont nou</p>

      <form action="#" method="post">
        <label>Nume utilizator:</label><br>
        <input type="text" name="username" required><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Parolă:</label><br>
        <input type="password" name="password" required><br><br>

        <label>Confirmă parola:</label><br>
        <input type="password" name="confirm_password" required><br><br>

        <button type="submit">Înregistrează-te</button>
      </form>

      <p>Ai deja un cont? <a href="login.html">Autentifică-te aici</a>.</p>
    </section>
  </main>

  <footer>
    <p>Geo Quiz</p>
  </footer>

</body>
</html>
